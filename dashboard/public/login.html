<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluxmart Admin — Sign in</title>
<link rel="stylesheet" href="/styles.css">
<meta name="color-scheme" content="light dark">
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <div class="login-mark">B</div>
    <h1>Bluxmart Admin</h1>
    <p class="login-sub">Sign in to manage your Discord bot configuration.</p>
    <div id="err" class="alert alert-error" style="display:none"></div>
    <form id="f" autocomplete="on">
      <div class="field">
        <label for="u">Username</label>
        <input id="u" name="username" type="text" autocomplete="username" required maxlength="64" placeholder="admin">
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required placeholder="••••••••••">
        <div class="hint">Protected by rate limiting. Sessions expire after 12 hours.</div>
      </div>
      <button class="btn btn-primary btn-block" id="btn" type="submit">Sign in</button>
    </form>
    <p class="login-sub" style="margin:18px 0 0;font-size:12px">First run? Create credentials with <span class="mono">npm run dashboard:hash -- --save</span></p>
  </div>
</main>
<script src="/login.js"></script>
</body>
</html>
